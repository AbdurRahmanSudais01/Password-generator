<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            background-color: #032830;
        }
        form{
            width: 90dvw;
            height: 80dvh;
            padding: 50px;
            background-color: #031633;
            color: #dee2e6;
            border-radius: 20px;
        }
        .input-group img{
            height: 24px;
        }
        input:focus{
            outline: #dee2e6;
        }
        span{
          color: grey;
        }
    </style>
</head>
<body>
    <form id="form">
        <h1>Password Generator</h1>
        <br>
        <br>
        <div class="row mb-3">
          <label for="inputLength" class="col-sm-2 col-form-label">length</label>
          <div class="col-sm-10">
            <select name="length" id="length" class="form-control">
                <option value="0">select</option>
                <option value="4">4</option>
                <option value="6">6</option>
                <option value="8">8</option>
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="16">16</option>
            </select>
          </div>
        </div>
        <fieldset class="row mb-3">
          <legend class="col-form-label col-sm-2 pt-0"></legend>
          <div class="col-sm-10">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="type" id="strong" value="strong" checked>
              <label class="form-check-label" for="strong">
                Strong <span>Include Special Character (#@!><.,';')</span>
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="type" id="alphaNumeric" value="alphaNumeric">
              <label class="form-check-label" for="alphaNumeric">
                Alpha-Numeric
              </label>
            </div>
          </div>
        </fieldset>
        
        <button type="submit" class="btn btn-primary">Generate Password</button>
        <br>
        <br>
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Generated Password" aria-label="Recipient's username" aria-describedby="button-addon2" id="result">
          <button class="btn" type="button" id="button-addon2" onclick="copytext()"><img id="image" src="file.png" alt=""></button>
        </div>
      </form>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
